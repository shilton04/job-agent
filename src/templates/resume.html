<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { font-family: 'Helvetica Neue', Arial, sans-serif; color: #1a1a1a; margin: 40px; font-size: 13px; line-height: 1.5; }
  h1 { margin-bottom: 2px; font-size: 24px; }
  .title { color: #555; margin-top: 0; margin-bottom: 12px; }
  .contact { font-size: 12px; color: #555; margin-bottom: 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #ccc; padding-bottom: 4px; margin-top: 24px; }
  .job { margin-bottom: 14px; }
  .job-header { display: flex; justify-content: space-between; font-weight: 600; }
  ul { margin: 6px 0 0 0; padding-left: 18px; }
  .skills span { display: inline-block; background: #f0f0f0; padding: 3px 8px; border-radius: 4px; margin: 2px; font-size: 12px; }
</style>
</head>
<body>
  <h1>{{name}}</h1>
  <p class="title">{{title}}</p>
  <p class="contact">{{email}} · {{phone}} · {{location}}</p>

  <h2>Summary</h2>
  <p>{{summary}}</p>

  <h2>Skills</h2>
  <div class="skills">{{skillsHtml}}</div>

  <h2>Experience</h2>
  {{experienceHtml}}

  <h2>Education</h2>
  {{educationHtml}}
</body>
</html>
